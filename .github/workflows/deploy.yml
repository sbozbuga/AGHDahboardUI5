name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Cancel in-progress runs when a new push is made
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # 🛡️ PHASE 1: Quality Checks
  quality-checks:
    name: 🎨 Lint, Format & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Run Health Verification
        run: npm run health

  # 🚀 PHASE 2: Continuous Deployment
  deploy:
    name: 🚀 Deploy to Raspberry Pi 5
    needs: [quality-checks]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    
    # 🌟 Configures GitHub Environment for deployment tracking & scoped secrets
    environment:
      name: production

    # Bind secrets to env variables for conditional checks
    env:
      HAS_TS_OAUTH: ${{ secrets.TS_OAUTH_CLIENT_ID != '' && secrets.TS_OAUTH_SECRET != '' }}
      HAS_SSH_KEY: ${{ secrets.PI5_SSH_KEY != '' }}

    steps:
      - name: Join Tailscale
        if: env.HAS_TS_OAUTH == 'true'
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:deploy

      - name: Wait for MagicDNS propagation
        if: env.HAS_TS_OAUTH == 'true'
        run: sleep 1

      - name: Resolve deployment host
        if: env.HAS_SSH_KEY == 'true'
        run: |
          echo "DEPLOY_HOST=${{ secrets.PI5_HOST }}" >> $GITHUB_ENV
          echo "DEPLOY_USER=${{ secrets.PI5_USER }}" >> $GITHUB_ENV

      - name: Deploy to Pi 5 via SSH (aghd-up)
        if: env.HAS_SSH_KEY == 'true'
        run: |
          # Setup SSH directory and register key
          mkdir -p ~/.ssh
          echo "${{ secrets.PI5_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          # Scan and register host key to avoid interactive prompt
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

          # Execute remote deployment script using absolute path
          echo "🚀 Triggering remote deployment (aghd-up) on $DEPLOY_USER@$DEPLOY_HOST..."
          ssh -i ~/.ssh/id_ed25519 -o ConnectTimeout=20 "$DEPLOY_USER@$DEPLOY_HOST" "/home/sb/lab-mon/scripts/aghd-up"
          echo "✅ Remote deployment completed successfully."
